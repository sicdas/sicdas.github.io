# Ponentes. Cada ponente necesita un "id" único (se usa en programa.yml).
# Para un ponente confirmado, reemplace los datos y la foto, por ejemplo:
#
# - id: maria-perez
#   nombre: María Pérez Gómez
#   cargo: Profesora de Ciencia de Datos
#   institucion: Universidad X, España
#   area: MACHINE LEARNING          # texto corto bajo el nombre en la rejilla
#   foto: assets/2026/images/ponentes/maria-perez.jpg
#   linkedin: https://www.linkedin.com/in/maria-perez/
#   tema: Título de la conferencia
#   bio:
#     - Primer párrafo de la biografía.
#     - Segundo párrafo (opcional).
#
# Si "foto" está vacío se usa la imagen genérica. Si "bio" está vacío se muestra
# "Biografía por confirmar".

- id: ponente-1
  nombre: Ponente por confirmar
  cargo: Conferencista
  institucion: Institución por confirmar
  area: Big Data Analytics
  foto: ""
  linkedin: ""
