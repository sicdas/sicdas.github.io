# Textos de la sección "Sobre el evento"
sobre:
  - >-
    El Grupo de Investigación ITDATA, el Decanato, el Vicedecanato Académico y el
    Instituto de Investigación de la Facultad de Ingeniería de Sistemas e Informática
    (FISI) de la Universidad Nacional Mayor de San Marcos (UNMSM) se complacen en
    presentar la organización del VII Seminario Internacional de Ciencia de Datos
    Aplicada a la Sociedad (SICDAS).
  - >-
    Su propósito es fomentar y fortalecer el intercambio de experiencias académicas e
    investigativas entre profesionales y estudiantes de Ingeniería de Sistemas,
    Ingeniería de Software, Computación e Informática, así como con todos los
    participantes interesados.
  - >-
    El SICDAS aborda Big Data Analytics, Machine Learning, Data Mining, Business
    Intelligence, Data Science, Open Data, Gobierno de Datos y Deep Learning, con
    enfoque en su aplicación a los desafíos sociales. Habrá conferencias, una mesa
    redonda, intercambio de ideas y experiencias, y certificados para los interesados.

