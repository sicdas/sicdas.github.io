# Preguntas frecuentes.
- pregunta: ¿QUIÉNES PUEDEN PARTICIPAR?
  respuesta: >-
    Profesionales y estudiantes de Ingeniería de Sistemas, Ingeniería de Software,
    Computación e Informática, y todas las personas interesadas en la ciencia de datos.
- pregunta: ¿CÓMO ME CONECTO?
  respuesta: >-
    El evento es virtual. Publicaremos el enlace de Google Meet y la retransmisión en
    YouTube antes del 18 de diciembre.
- pregunta: ¿ENTREGAN CERTIFICADO?
  respuesta: >-
    Sí. Se otorgarán certificados a los interesados que completen el registro para
    certificado.
- pregunta: ¿CUÁNDO ABRE LA INSCRIPCIÓN?
  respuesta: >-
    Muy pronto. Síguenos en redes sociales para enterarte cuando se abra el formulario.
